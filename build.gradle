plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'Main'
}

javafx {
    version = '17.0.6'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.32'

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}

// Optional LAN settings: gradlew run -PserverHost=192.168.1.10 -PserverPort=5000
tasks.named('run', JavaExec) {
    systemProperty 'damka.server.host', project.findProperty('serverHost') ?: 'localhost'
    systemProperty 'damka.server.port', project.findProperty('serverPort') ?: '5000'
}

tasks.register('tcpServer', JavaExec) {
    group = 'application'
    description = 'Run the TCP game server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'DamkaServer'
}
