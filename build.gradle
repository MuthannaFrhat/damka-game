plugins {
    id 'java'
    id 'application'
    id 'org.javamodularity.moduleplugin' version '1.8.12'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '2.25.0'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '8'
targetCompatibility = '8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'Main'
}

javafx {
    version = '17.0.6'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}

// Console networking checks run independently of the JavaFX application.
tasks.register('tcpServer', JavaExec) {
    group = 'application'
    description = 'Run the multiplayer TCP server (optional -PserverPort and -PserverBind).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'DamkaServer'
    args project.findProperty('serverPort') ?: '5000',
            project.findProperty('serverBind') ?: '0.0.0.0'
}

tasks.register('connectionCheck', JavaExec) {
    group = 'application'
    description = 'Run a console multiplayer client (optional -PserverHost, -PserverPort, -ProomCode).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ServerConnectionCheck'
    args project.findProperty('serverHost') ?: '127.0.0.1',
            project.findProperty('serverPort') ?: '5000'
    if (project.hasProperty('roomCode')) { args project.property('roomCode') }
    standardInput = System.in
}

jlink {
    imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'app'
    }
}

jlinkZip {
    group = 'distribution'
}
