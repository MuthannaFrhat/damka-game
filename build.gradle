plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'Main'
}

javafx {
    version = '17.0.6'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.32'

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}

// Optional LAN settings: gradlew run -PserverHost=192.168.1.10 -PserverPort=5000
tasks.named('run', JavaExec) {
    systemProperty 'damka.server.host', project.findProperty('serverHost') ?: 'localhost'
    systemProperty 'damka.server.port', project.findProperty('serverPort') ?: '5000'
}

tasks.register('tcpServer', JavaExec) {
    group = 'application'
    description = 'Run the TCP game server.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'DamkaServer'
}

// Optional demo tools are compiled separately from the game and its tests.
sourceSets {
    demo {
        java.srcDir 'demo/src/main/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('demo', JavaExec) {
    group = 'application'
    description = 'Play and record the automated JavaFX demonstration (requires FFmpeg).'
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'DemoRunner'
    // Keep Robot and Windows desktop capture in the same pixel coordinates.
    jvmArgs '-Dglass.win.uiScale=100%'
    systemProperty 'javafx.cachedir', layout.buildDirectory.dir('javafx-cache').get().asFile.path
    systemProperty 'damka.demo.record', project.findProperty('demoRecord') ?: 'true'
    systemProperty 'damka.demo.speed', project.findProperty('demoSpeed') ?: '1'
    systemProperty 'damka.demo.output', project.findProperty('demoOutput') ?: 'demo/output'
    systemProperty 'damka.demo.ffmpeg', project.findProperty('ffmpeg') ?: 'ffmpeg'
}
